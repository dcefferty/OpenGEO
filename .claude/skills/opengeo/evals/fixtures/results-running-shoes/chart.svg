<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" role="img" class="c" aria-label="Citation rate before and after your edit, per engine. How often should I replace my running shoes?"><style>
.c{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
   --base:#c3c2b7;--before:#86b6ef;--after:#1c5cab}
@media (prefers-color-scheme:dark){.c{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;
   --muted:#898781;--grid:#2c2c2a;--base:#383835;--before:#1c5cab;--after:#86b6ef}}
.c{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .base{stroke:var(--base);stroke-width:1}
.before{fill:var(--before)} .after{fill:var(--after)}
.link{stroke:var(--before);stroke-width:2;stroke-linecap:round}
.ring{stroke:var(--surface);stroke-width:2}
.num{font-variant-numeric:tabular-nums}
</style>
<rect class="bg" width="760" height="418" rx="8"/>
<text class="t1" x="24" y="34" font-size="17" font-weight="600">How often AI answers cite your page, before and after your edit</text>
<text class="t2" x="24" y="56" font-size="13">How often should I replace my running shoes?</text>
<circle class="before ring" cx="29" cy="76" r="5"/><text class="t2" x="40" y="80" font-size="12">Before</text>
<circle class="after ring" cx="93" cy="76" r="5"/><text class="t2" x="104" y="80" font-size="12">After your edit</text>
<line class="grid" x1="176.0" y1="86" x2="176.0" y2="342"/>
<text class="tm num" x="176.0" y="360" font-size="11" text-anchor="middle">0%</text>
<line class="grid" x1="279.0" y1="86" x2="279.0" y2="342"/>
<text class="tm num" x="279.0" y="360" font-size="11" text-anchor="middle">25%</text>
