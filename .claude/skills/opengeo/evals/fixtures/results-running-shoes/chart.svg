<text class="t1 num" x="736" y="324.0" font-size="14" font-weight="600" text-anchor="end">+21 pts</text><text class="tm num" x="736" y="338.0" font-size="10.5" text-anchor="end">95% CI +9 to +31</text></g>
<text class="tm" x="24" y="384" font-size="11">* already cited almost every time before the edit: little room to rise</text>
