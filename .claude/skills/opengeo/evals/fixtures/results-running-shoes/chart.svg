<text class="tm num" x="485.0" y="360" font-size="11" text-anchor="middle">75%</text>
<line class="grid" x1="588.0" y1="86" x2="588.0" y2="342"/>
<text class="tm num" x="588.0" y="360" font-size="11" text-anchor="middle">100%</text>
